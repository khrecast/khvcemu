name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Install ffmpeg on Linux (the sound tests that need it skip where it is missing)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Byte-compile everything
        run: python -m compileall -q khvcemu tools tests
      - name: Unit tests (no game files needed)
        run: python -m unittest tests.test_units tests.test_music_settings tests.test_music_mixes tests.test_playtime tests.test_shared_leaderboard tests.test_launcher_states tests.test_checksums -v
