# The project website (site/), served by Cloudflare as static files. Deploy from THIS folder (never from
# server/, which holds the leaderboard's config):
#
#   cd site-deploy && npx --prefix ../server wrangler deploy --config wrangler.toml
#
# The site is public. Until launch it sat behind a password splash page (gate.js, kept here with its tests).
# To close it again: add `main = "gate.js"`, a `[vars]` block with `GATE = "on"`, and `binding = "ASSETS"` and
# `run_worker_first = true` under the assets block, set the Worker secret SITE_PASSWORD (see gate.js), then deploy.
name = "khrecast-site"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "khrecast.com", custom_domain = true },
  { pattern = "www.khrecast.com", custom_domain = true },
]

[assets]
directory = "../site"
