[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khvcemu"
dynamic = ["version"]
description = "Kingdom Hearts Re:Cast: an emulator for the 2005 Verizon V CAST Kingdom Hearts mobile game (Qualcomm BREW)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "khrecast", email = "khrecast@gmail.com" }]
keywords = ["emulator", "brew", "kingdom-hearts", "preservation", "v-cast", "unicorn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Emulators",
]
dependencies = [
    "unicorn>=2.0.1",
    "pygame-ce>=2.5",
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["capstone>=5.0"]

[project.scripts]
khvcemu = "khvcemu.__main__:main"
khvcemu-launcher = "khvcemu.launcher:main"

[project.urls]
Homepage = "https://github.com/khrecast/khvcemu"
Issues = "https://github.com/khrecast/khvcemu/issues"

[tool.setuptools]
packages = ["khvcemu"]

[tool.setuptools.dynamic]
version = { attr = "khvcemu.__version__" }

[tool.setuptools.package-data]
khvcemu = ["assets/*.png", "assets/*.ico", "assets/tabs/*.png"]
